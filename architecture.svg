<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#11111b" />
    </linearGradient>
    <linearGradient id="box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#313244" />
      <stop offset="100%" stop-color="#1e1e2e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)" rx="12" />

  <!-- Title -->
  <text x="400" y="50" font-family="-apple-system, system-ui, sans-serif" font-size="24" font-weight="bold" fill="#cba6f7" text-anchor="middle">How ContextFlow Works</text>

  <!-- Shell Box -->
  <g transform="translate(50, 100)" filter="url(#shadow)">
    <rect width="200" height="240" fill="url(#box)" rx="8" stroke="#89b4fa" stroke-width="2"/>
    <text x="100" y="40" font-family="monospace" font-size="18" fill="#89b4fa" font-weight="bold" text-anchor="middle">Terminal / Shell</text>
    <text x="20" y="80" font-family="monospace" font-size="14" fill="#a6adc8">$ docker build .</text>
    <text x="20" y="110" font-family="monospace" font-size="14" fill="#a6adc8">$ docker run -p</text>
    <text x="20" y="140" font-family="monospace" font-size="14" fill="#a6adc8">$ curl localhost</text>
    <text x="20" y="170" font-family="monospace" font-size="14" fill="#a6adc8">$ git commit</text>
    <text x="100" y="210" font-family="sans-serif" font-size="12" fill="#6c7086" text-anchor="middle">Bash / Zsh / Fish</text>
  </g>

  <!-- Arrow -->
  <path d="M 260 220 L 330 220" stroke="#f38ba8" stroke-width="4" marker-end="url(#arrow)" stroke-dasharray="8,4" />
  <text x="295" y="200" font-family="sans-serif" font-size="12" fill="#f38ba8" font-weight="bold" text-anchor="middle">Detects Context</text>

  <!-- Database Box -->
  <g transform="translate(350, 100)" filter="url(#shadow)">
    <rect width="200" height="240" fill="url(#box)" rx="8" stroke="#a6e3a1" stroke-width="2"/>
    <text x="100" y="40" font-family="sans-serif" font-size="18" fill="#a6e3a1" font-weight="bold" text-anchor="middle">ContextFlow DB</text>
    
    <rect x="15" y="60" width="170" height="50" fill="#45475a" rx="4" />
    <text x="25" y="80" font-family="monospace" font-size="12" fill="#cdd6f4">Repo: backend</text>
    <text x="25" y="100" font-family="monospace" font-size="12" fill="#f9e2af">docker build...</text>

    <rect x="15" y="120" width="170" height="50" fill="#45475a" rx="4" />
    <text x="25" y="140" font-family="monospace" font-size="12" fill="#cdd6f4">Repo: frontend</text>
    <text x="25" y="160" font-family="monospace" font-size="12" fill="#f9e2af">npm run dev</text>
    
    <text x="100" y="210" font-family="sans-serif" font-size="12" fill="#6c7086" text-anchor="middle">Local SQLite</text>
  </g>

  <!-- Outputs Box -->
  <g transform="translate(620, 100)">
    <!-- Arrow 1 -->
    <path d="M 560 140 L 610 140" stroke="#fab387" stroke-width="3" />
    <rect width="130" height="60" fill="url(#box)" rx="6" stroke="#fab387" stroke-width="2" filter="url(#shadow)"/>
    <text x="65" y="35" font-family="sans-serif" font-size="16" fill="#fab387" font-weight="bold" text-anchor="middle">Export</text>
    
    <!-- Arrow 2 -->
    <path d="M 560 210 L 610 210" stroke="#b4befe" stroke-width="3" />
    <rect y="180" width="130" height="60" fill="url(#box)" rx="6" stroke="#b4befe" stroke-width="2" filter="url(#shadow)"/>
    <text x="65" y="215" font-family="sans-serif" font-size="16" fill="#b4befe" font-weight="bold" text-anchor="middle">Fuzzy TUI</text>
    
    <!-- Arrow 3 -->
    <path d="M 560 280 L 610 280" stroke="#74c7ec" stroke-width="3" />
    <rect y="250" width="130" height="60" fill="url(#box)" rx="6" stroke="#74c7ec" stroke-width="2" filter="url(#shadow)"/>
    <text x="65" y="285" font-family="sans-serif" font-size="16" fill="#74c7ec" font-weight="bold" text-anchor="middle">Replay</text>
  </g>

  <!-- Definitions for Markers -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f38ba8" />
    </marker>
  </defs>
</svg>
