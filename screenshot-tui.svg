<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#1e1e2e" rx="12" />
  
  <!-- Window Controls -->
  <circle cx="20" cy="20" r="6" fill="#f38ba8" />
  <circle cx="40" cy="20" r="6" fill="#f9e2af" />
  <circle cx="60" cy="20" r="6" fill="#a6e3a1" />
  <text x="400" y="24" font-family="-apple-system, sans-serif" font-size="12" fill="#6c7086" text-anchor="middle">cf search</text>

  <!-- Prompt -->
  <text x="20" y="60" font-family="monospace" font-size="16" fill="#89b4fa">❯ docker</text>
  <rect x="95" y="47" width="2" height="15" fill="#cdd6f4" />
  
  <!-- Search Results -->
  <rect x="10" y="80" width="780" height="30" fill="#313244" rx="4" />
  <text x="20" y="100" font-family="monospace" font-size="14" fill="#a6e3a1">42</text>
  <text x="60" y="100" font-family="monospace" font-size="14" fill="#f38ba8">[backend]</text>
  <text x="160" y="100" font-family="monospace" font-size="14" fill="#cdd6f4">docker compose up --build -d</text>

  <text x="20" y="130" font-family="monospace" font-size="14" fill="#6c7086">41</text>
  <text x="60" y="130" font-family="monospace" font-size="14" fill="#f38ba8">[backend]</text>
  <text x="160" y="130" font-family="monospace" font-size="14" fill="#9399b2">docker ps | grep web</text>

  <text x="20" y="160" font-family="monospace" font-size="14" fill="#6c7086">38</text>
  <text x="60" y="160" font-family="monospace" font-size="14" fill="#89b4fa">[infra]</text>
  <text x="160" y="160" font-family="monospace" font-size="14" fill="#9399b2">docker push myorg/backend:latest</text>

  <text x="20" y="190" font-family="monospace" font-size="14" fill="#6c7086">15</text>
  <text x="60" y="190" font-family="monospace" font-size="14" fill="#89b4fa">[infra]</text>
  <text x="160" y="190" font-family="monospace" font-size="14" fill="#9399b2">docker build -t myorg/backend:latest .</text>

  <text x="20" y="220" font-family="monospace" font-size="14" fill="#6c7086">12</text>
  <text x="60" y="220" font-family="monospace" font-size="14" fill="#fab387">[frontend]</text>
  <text x="160" y="220" font-family="monospace" font-size="14" fill="#9399b2">docker run -p 3000:3000 nextjs-app</text>

  <!-- Footer Help -->
  <rect x="0" y="470" width="800" height="30" fill="#181825" />
  <text x="20" y="490" font-family="monospace" font-size="12" fill="#cba6f7">↑/↓ navigate</text>
  <text x="150" y="490" font-family="monospace" font-size="12" fill="#cba6f7">enter select</text>
  <text x="280" y="490" font-family="monospace" font-size="12" fill="#cba6f7">ctrl+c quit</text>
  <text x="700" y="490" font-family="monospace" font-size="12" fill="#6c7086">5/142 matches</text>
</svg>
